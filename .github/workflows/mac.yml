# Forbidden Recruit — construit l'application Mac (Apple Silicon et Intel) sur un Mac de GitHub
# et l'ajoute à la release. Se lance seul à chaque release publiée, ou à la main (onglet Actions).
name: Application Mac
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer l'application
        run: |
          mkdir -p build/src && cd build
          cp ../forbidden-recruit.html src/index.html
          cp ../icon-512.png src/icon.png
          cat > src/main.js <<'JS'
          const { app, BrowserWindow, shell, Menu } = require('electron');
          const path = require('path');
          if (!app.requestSingleInstanceLock()) app.quit();
          let win;
          function create() {
            win = new BrowserWindow({ width: 1360, height: 900, minWidth: 380, minHeight: 500, backgroundColor: '#0e0f11', title: 'Forbidden Recruit',
              webPreferences: { contextIsolation: true, sandbox: true, spellcheck: false } });
            win.loadFile(path.join(__dirname, 'index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => { if (/^https?:/.test(url)) shell.openExternal(url); return { action: 'deny' }; });
            win.webContents.on('will-navigate', (e, url) => { if (/^https?:/.test(url)) { e.preventDefault(); shell.openExternal(url); } });
          }
          app.on('second-instance', () => { if (win) { if (win.isMinimized()) win.restore(); win.focus(); } });
          app.whenReady().then(() => { Menu.setApplicationMenu(Menu.buildFromTemplate([{ role: 'appMenu' }, { role: 'editMenu' }, { role: 'viewMenu' }, { role: 'windowMenu' }])); create(); });
          app.on('window-all-closed', () => app.quit());
          JS
          echo '{ "name": "forbidden-recruit", "productName": "Forbidden Recruit", "version": "1.0.0", "main": "main.js" }' > src/package.json
          # icône .icns à partir du logo
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s ../icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d ../icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          cp ../icon-512.png icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          npm init -y >/dev/null
          npm i -D electron@33 @electron/packager@18
      - name: Construire et signer
        run: |
          cd build
          VER=$(node -p "require('../manifest.json').appVersion.replace(/-([a-z])$/, (m, l) => '.' + (l.charCodeAt(0) - 96))")
          cat > pack.js <<'JS'
          const { packager } = require('@electron/packager');
          (async () => { for (const arch of ['arm64', 'x64']) await packager({ dir: 'src', name: 'Forbidden Recruit', platform: 'darwin', arch, icon: 'icon.icns', out: 'out', overwrite: true, asar: true,
            electronVersion: require('electron/package.json').version, appBundleId: 'io.github.yaoz52.forbiddenrecruit', appCategoryType: 'public.app-category.utilities',
            appVersion: process.env.VER, buildVersion: process.env.VER, appCopyright: 'Outil non officiel' }); })().catch(e => { console.error(e); process.exit(1); });
          JS
          VER="$VER" node pack.js
          for arch in arm64 x64; do
            codesign --force --deep --sign - "out/Forbidden Recruit-darwin-$arch/Forbidden Recruit.app"
            codesign --verify --deep --strict "out/Forbidden Recruit-darwin-$arch/Forbidden Recruit.app"
          done
          ditto -c -k --keepParent "out/Forbidden Recruit-darwin-arm64/Forbidden Recruit.app" ../Forbidden-Recruit-Mac-Apple-Silicon.zip
          ditto -c -k --keepParent "out/Forbidden Recruit-darwin-x64/Forbidden Recruit.app" ../Forbidden-Recruit-Mac-Intel.zip
      - name: Ajouter à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG=$(gh release view --json tagName -q .tagName)
          gh release upload "$TAG" Forbidden-Recruit-Mac-Apple-Silicon.zip Forbidden-Recruit-Mac-Intel.zip --clobber
