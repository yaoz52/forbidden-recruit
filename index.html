<style>
:root{
  --ceramite:#20242a; --ceramite-2:#2c3138; --vellum:#e6e2d6; --paper:#f4f1e8; --ink:#25231e; --graphite:#5d5a51;
  --rule:#bdb7a6; --brass:#96762f; --brass-2:#c9a85a; --oxblood:#7e1f1b; --verdigris:#2c6a5c;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;
  --sans:"Gill Sans","Gill Sans MT","Segoe UI",Optima,Candara,"Noto Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--vellum);color:var(--ink);font-family:var(--serif);line-height:1.45;
  background-image:radial-gradient(circle at 88% 12%,transparent 0 180px,rgba(93,90,81,.10) 180px 181px,transparent 181px 240px,rgba(93,90,81,.08) 240px 241px,transparent 241px),
  radial-gradient(circle at 6% 92%,transparent 0 260px,rgba(93,90,81,.08) 260px 261px,transparent 261px 300px,rgba(93,90,81,.06) 300px 301px,transparent 301px);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,h4{font-variant-caps:small-caps;letter-spacing:.03em;font-weight:700;margin:0;line-height:1.15}
i{font-style:normal;color:var(--graphite);font-size:.84em}

/* Bandeau */
.top{background:var(--ceramite);color:#ece7d9;border-bottom:3px double var(--brass);position:sticky;top:0;z-index:20}
.top-in{max-width:1500px;margin:auto;padding:.6rem 1rem .5rem;display:grid;grid-template-columns:1fr auto;gap:.4rem 1.2rem;align-items:end}
.brand{font-family:var(--sans);font-size:.72rem;letter-spacing:.14em;color:var(--brass-2);grid-column:1/-1;display:flex;justify-content:space-between;gap:1rem}
.brand span:last-child{color:#9a968a;letter-spacing:.04em}
#name{background:none;border:0;border-bottom:1px solid #4a4f57;color:#f6f2e6;font-family:var(--serif);font-size:clamp(1.25rem,2.6vw,1.9rem);font-variant-caps:small-caps;letter-spacing:.03em;font-weight:700;width:100%;padding:.05rem 0;min-width:0}
#name:focus{border-bottom-color:var(--brass-2);outline:0}
.setup{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin-top:.45rem}
.setup select,.setup input{background:var(--ceramite-2);border:1px solid #4a4f57;color:#ece7d9;border-radius:2px;padding:.3rem .45rem;font-family:var(--sans);font-size:.86rem;max-width:100%}
#limitx{width:6.5rem}
#meter{text-align:right;font-family:var(--sans);min-width:9.5rem}
#meter b{font-family:var(--serif);font-size:clamp(1.7rem,4vw,2.5rem);line-height:1;font-variant-numeric:tabular-nums}
#meter small{color:#a9a498;font-size:.85rem}
#meter.over b{color:#e9867c}
.track{height:4px;background:#3a4048;margin-top:.3rem}.track div{height:100%;background:var(--brass-2);width:0;transition:width .25s}
#meter.over .track div{background:#d0584c}
#verdict{font-family:var(--sans);font-size:.8rem;margin-top:.25rem}#verdict.good{color:#8fcbb9}#verdict.bad{color:#eba097}
.tools{background:var(--ceramite-2);border-top:1px solid #3d434b}
.tools-in{max-width:1500px;margin:auto;padding:.3rem 1rem;display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.tools button{background:none;border:1px solid transparent;color:#d9d4c5;font-family:var(--sans);font-size:.86rem;padding:.3rem .6rem;border-radius:2px}
.tools button:hover{border-color:var(--brass)}
.tools #update{background:var(--brass);color:#16181c;font-weight:600;margin-left:auto}

/* Plan */
main{max-width:1500px;margin:auto;padding:1rem;display:grid;gap:1rem;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){main{grid-template-columns:minmax(0,1fr) minmax(340px,430px);align-items:start}}
.det{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:.8rem .9rem .7rem;margin-bottom:1rem;box-shadow:0 1px 0 #fff inset}
.det.k-aux,.det.k-apex{margin-left:clamp(.6rem,3vw,2.2rem);border-top-color:var(--graphite)}
.det.k-allie{border-top-color:var(--verdigris)}.det.k-sdg,.det.k-sdb{border-top-color:var(--brass)}
.det.bad{border-left:3px solid var(--oxblood)}
.det header{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.det h2{font-size:1.2rem}
.kind{font-family:var(--sans);font-size:.76rem;color:var(--graphite);margin:.1rem 0 0;letter-spacing:.02em}
.dp{font-family:var(--sans);font-size:.85rem;white-space:nowrap}.dp b{font-family:var(--serif);font-size:1.25rem}
.note{font-size:.86rem;color:var(--graphite);margin:.4rem 0}
.inl{font-family:var(--sans);font-size:.84rem;display:block;margin:.5rem 0}
.inl select{background:#fff;border:1px solid var(--rule);padding:.3rem;border-radius:2px;max-width:100%}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:.45rem;margin-top:.7rem}
.slot{display:flex;gap:.55rem;align-items:center;text-align:left;background:none;border:1px dashed var(--rule);border-radius:2px;padding:.3rem .5rem .3rem .3rem;min-height:3.5rem}
.slot:hover{background:#fbf9f2;border-color:var(--graphite)}
.slot.filled{border-style:solid;background:#fbf9f2}
.slot.sel{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.slot.bad{border-color:var(--oxblood)}
.sl{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.sl b{font-size:.98rem;overflow-wrap:anywhere}.sl em{font-style:italic;color:var(--graphite)}.sl i{font-family:var(--sans);font-size:.74rem}
.glyph{width:44px;height:44px;flex:none;display:block}
.glyph circle{fill:none;stroke:var(--graphite);stroke-width:2.2}
.glyph text{font-family:var(--sans);font-size:15px;font-weight:700;fill:var(--graphite);letter-spacing:.02em}
.glyph .spk{fill:var(--graphite)}
.glyph.on circle{fill:var(--ink);stroke:var(--ink)}.glyph.on text{fill:var(--paper)}.glyph.on .spk{fill:var(--brass)}
.glyph.bonus circle{stroke-dasharray:4 3}
.link{background:none;border:0;font-family:var(--sans);font-size:.8rem;text-decoration:underline;padding:.5rem 0 0;color:var(--graphite)}
.danger{color:var(--oxblood)}
#add-det{width:100%;padding:.75rem;background:none;border:1px solid var(--ink);font-variant-caps:small-caps;letter-spacing:.05em;font-weight:700;font-size:1.02rem}
#add-det:hover{background:var(--ink);color:var(--paper)}
.panel{background:var(--paper);border:1px solid var(--rule);padding:.8rem .9rem;margin-top:1rem}
.panel h2{font-size:1.05rem;margin-bottom:.4rem}
#issues{margin:0;padding:0;list-style:none}
#issues li,.iss li{font-size:.9rem;padding:.4rem 0 .4rem .7rem;border-left:3px solid var(--oxblood);margin:.35rem 0;cursor:pointer}
#issues li.warn,.iss li.warn{border-left-color:var(--brass)}
#issues li.info,.iss li.info{border-left-color:var(--verdigris)}
.iss{list-style:none;padding:0;margin:.5rem 0}
.ok{color:var(--verdigris);margin:.2rem 0;font-size:.92rem}

/* Éditeur */
#editor{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--brass)}
@media(min-width:900px){#editor{position:sticky;top:8.6rem;max-height:calc(100vh - 9.4rem);overflow:auto}#b-close{display:none}}
@media(max-width:899px){.top{position:static}.top-in{grid-template-columns:1fr}#meter{text-align:left}
  #editor{position:fixed;inset:0;z-index:40;overflow:auto;transform:translateY(102%);transition:transform .22s;border:0}
  body.editing #editor{transform:none}body.editing{overflow:hidden}}
@media(prefers-reduced-motion:reduce){#editor,.track div{transition:none}}
.ed-bar{display:flex;justify-content:flex-end;padding:.4rem .6rem 0}
#b-close{background:var(--ink);color:var(--paper);border:0;padding:.45rem .9rem;font-family:var(--sans);font-size:.86rem;border-radius:2px}
#editor-body{padding:.3rem .95rem 1.2rem}
#editor-body h3{font-size:1.45rem}
#editor-body h4{font-size:.98rem;margin:1rem 0 .35rem;border-bottom:1px solid var(--rule);padding-bottom:.15rem}
.cost{margin:.2rem 0 .6rem;font-family:var(--sans);font-size:.88rem}.cost b{font-family:var(--serif);font-size:1.4rem}
.ref{color:var(--graphite)}
.empty{padding:2rem .5rem;color:var(--graphite)}.empty h3{font-size:1.15rem;color:var(--ink);margin-bottom:.4rem}
fieldset{border:1px solid var(--rule);margin:.7rem 0;padding:.3rem .65rem .5rem;min-width:0}
fieldset.prime{border-color:var(--brass)}fieldset.ko{opacity:.6}
legend{font-size:.92rem;font-weight:700;padding:0 .3rem}legend i{font-weight:400}
.opt{display:grid;grid-template-columns:auto 1fr auto auto;gap:.5rem;align-items:center;padding:.32rem 0;border-top:1px solid #e3dece;font-size:.93rem}
.opt:first-of-type{border-top:0}
.opt span i{display:block;font-family:var(--sans);font-size:.76rem;line-height:1.3}
.opt b{font-family:var(--sans);font-size:.8rem;font-weight:600;white-space:nowrap;color:var(--graphite)}
.opt.ko{color:#8d897e}
div.opt{grid-template-columns:1fr auto auto}
.opt input{width:1.1rem;height:1.1rem;accent-color:var(--ink);margin:0}
.row{display:flex;justify-content:space-between;gap:.8rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.row span i{display:block;font-family:var(--sans)}
.step{display:inline-flex;align-items:center;border:1px solid var(--ink);border-radius:2px}
.step button{background:none;border:0;width:2.1rem;height:2.1rem;font-size:1.15rem;line-height:1}
.step button:disabled{opacity:.25;cursor:default}
.step output{min-width:1.7rem;text-align:center;font-variant-numeric:tabular-nums;font-family:var(--sans)}
.tblw{overflow-x:auto}
table.stats{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.86rem;margin:.2rem 0 .5rem}
.stats th,.stats td{padding:.2rem .3rem;text-align:center;border-bottom:1px solid var(--rule)}
.stats thead th{font-family:var(--sans);font-size:.72rem;color:var(--graphite);font-weight:600;border-bottom:1.5px solid var(--ink)}
.stats tbody th{text-align:left;font-weight:400;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{font-family:var(--sans);font-size:.8rem;background:none;border:1px solid var(--rule);border-radius:2px;padding:.18rem .45rem}
button.chip{border-bottom:2px solid var(--brass);cursor:help}button.chip.plain{border-bottom:1px solid var(--rule)}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:.42rem .8rem;font-family:var(--sans);font-size:.85rem;border-radius:2px}
.btn.ghost{background:none;color:var(--ink)}.btn.danger{background:none;color:var(--oxblood);border-color:var(--oxblood)}

/* Dialogue */
dialog{border:1px solid var(--ink);border-top:3px solid var(--brass);background:var(--paper);color:var(--ink);padding:0;width:min(720px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(22,24,28,.62)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:1}
.dlg-h h2{font-size:1.2rem}#dlg-x{background:none;border:0;font-size:1.5rem;line-height:1;padding:.1rem .4rem}
#dlg-body{padding:.7rem .9rem 1rem;overflow:auto}
#dlg-body h4{margin:1rem 0 .3rem;font-size:.98rem;border-bottom:1px solid var(--rule)}
#dlg-body input[type=search]{width:100%;padding:.5rem;border:1px solid var(--rule);background:#fff;margin-bottom:.5rem;border-radius:2px}
.pick{display:flex;justify-content:space-between;gap:.8rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #e0dbcb;padding:.5rem .3rem}
button.pick:hover:not(:disabled){background:#fbf9f2}
.pick>span:first-child{display:flex;flex-direction:column;min-width:0}
.pick i{font-family:var(--sans);font-size:.78rem;line-height:1.35}
.pick.ko{color:#7d796f;cursor:default}.pick.ko i{color:var(--oxblood)}
.pick.cur{border-left:3px solid var(--brass);padding-left:.6rem}
.pp{font-family:var(--sans);font-size:.86rem;white-space:nowrap}.pp.over{color:var(--oxblood)}
.mini{display:flex;flex-wrap:wrap;gap:1px;margin:.2rem 0}.mini .glyph{width:26px;height:26px}
.det-pick .acts{margin:0;flex:none}
details summary{cursor:pointer;font-family:var(--sans);font-size:.86rem;padding:.7rem 0 .2rem;color:var(--graphite)}
ul.plain{padding-left:1.1rem;font-size:.92rem}
#tip{position:fixed;z-index:60;background:var(--ceramite);color:#ece7d9;padding:.6rem .75rem;border-top:2px solid var(--brass-2);font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}
#tip b{font-variant-caps:small-caps;letter-spacing:.04em;font-size:1rem}#tip p{margin:.25rem 0}#tip i{color:#aaa598;font-family:var(--sans);font-size:.76rem}
#flash{opacity:0;position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,200%);background:var(--ceramite);color:#fff;padding:.6rem 1rem;font-family:var(--sans);font-size:.88rem;z-index:70;transition:transform .2s}
#flash.on{transform:translate(-50%,0);opacity:1}
.pending{border-left:3px solid var(--brass);padding-left:.6rem}

#summary{margin:.4rem 0 0;font-family:var(--sans);font-size:.86rem;color:#c9c4b5}
#steps{max-width:1500px;margin:auto;padding:.9rem 1rem 0;display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
#steps button{background:none;border:0;border-top:3px solid var(--rule);text-align:left;padding:.4rem .2rem;font-family:var(--sans);font-size:.8rem;color:var(--graphite);line-height:1.25}
#steps button b{display:block;font-family:var(--serif);font-variant-caps:small-caps;letter-spacing:.03em;font-size:1rem;color:var(--ink)}
#steps button.done{border-top-color:var(--ink)}#steps button.cur{border-top-color:var(--brass);color:var(--ink)}
#steps button span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){#steps button span{display:none}#steps button b{font-size:.86rem}}
#wiz{background:var(--paper);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:1rem 1rem 1.2rem;margin-bottom:1rem}
#wiz h2{font-size:1.45rem;margin-bottom:.25rem}#wiz h3{font-size:1.05rem;margin:1.1rem 0 .45rem}
#wiz p{margin:.2rem 0 .6rem;max-width:62ch}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.45rem}
.choices.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.choice{background:#fbf9f2;border:1px solid var(--rule);border-radius:2px;padding:.6rem .7rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-height:3.2rem;justify-content:center}
.choice b{font-size:1.02rem}.choice i{font-family:var(--sans);font-size:.76rem;line-height:1.3}
.choice:hover{border-color:var(--graphite)}
.legacy-box{display:flex;gap:.7rem;align-items:flex-start;margin:1.2rem 0 .4rem;padding:.8rem 1rem;border:1px solid var(--brass);background:#efe9d8;cursor:pointer}.legacy-box input{margin-top:.25rem;width:1.1rem;height:1.1rem;accent-color:var(--oxblood)}.legacy-box b{display:block}.legacy-box i{display:block;font-size:.85rem;color:#5d5a51;margin-top:.2rem}
.tag{display:inline-block;margin-left:.4rem;padding:0 .35rem;border:1px solid var(--brass);border-radius:2px;font:600 .62rem/1.5 var(--sans,sans-serif);letter-spacing:.04em;color:var(--brass);vertical-align:middle}
.brandname{display:inline-flex;align-items:center;gap:.5rem}
.brand .logo{width:26px;height:26px;border-radius:4px;flex:none}
.tag.warn{border-color:#b5533c;color:#b5533c}
.note.warn{border-left:3px solid #b5533c;padding-left:.5rem}
.oaths{margin:.4rem 0 .8rem;padding:.4rem .7rem;border:1px solid #c9bfa3;background:#f1ecdf}.oaths summary{cursor:pointer;font-weight:600}
.altmain{margin-bottom:1rem}.altmain .mini{display:flex;flex-wrap:wrap;gap:2px;margin-top:.4rem}.altmain .mini svg{width:18px;height:18px}.altmain .choice{justify-content:flex-start}.choice[aria-pressed=true] .glyph circle{stroke:#cfcabb}.choice[aria-pressed=true] .glyph text,.choice[aria-pressed=true] .glyph .spk{fill:#cfcabb}
label.inl.blk{display:block;margin:.5rem 0}
table.weap td{font-size:.78rem;white-space:normal}table.weap th:first-child{min-width:7rem}
.sh-extra{font-size:9pt;margin:0 0 4mm;color:#3b3830}
.choice.off{opacity:.45;cursor:not-allowed}.sh-rite{border:1px solid #b9a97a;padding:3mm 4mm;margin:0 0 5mm;break-inside:avoid}.sh-rite h2{display:flex;justify-content:space-between;font-size:12pt;margin:0 0 2mm}.sh-rite p{margin:1mm 0;font-size:9pt}.choice[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.choice[aria-pressed=true] i{color:#cfcabb}
.choice input{width:6rem;padding:.25rem;border:1px solid var(--rule);font-family:var(--sans);margin-top:.2rem}
#wiznav{display:flex;justify-content:space-between;gap:.6rem;margin:1rem 0 2rem}
#wiznav .btn{padding:.7rem 1.1rem;font-size:.95rem}
body[data-step="1"] #dets,body[data-step="2"] #dets,body[data-step="1"] #add-det,body[data-step="2"] #add-det,body[data-step="3"] #add-det,
body[data-step="1"] #conf,body[data-step="2"] #conf,body[data-step="1"] #editor,body[data-step="2"] #editor,body[data-step="3"] #wiz,body[data-step="4"] #wiz{display:none}
body[data-step="1"] main,body[data-step="2"] main{grid-template-columns:minmax(0,860px);justify-content:center}
.lead{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--brass);padding:.6rem .8rem;margin-bottom:1rem;font-size:.93rem}
#sheet{display:none}

/* Feuille imprimée / PDF */
@page{size:A4;margin:13mm 12mm 14mm}
@media print{
  body{background:#fff}
  .top,main,dialog,#tip,#flash,#steps{display:none!important}
  #sheet{display:block;color:#1c1b18;font-size:9.6pt;line-height:1.35}
  .sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.2pt double #1c1b18;padding-bottom:5pt;margin-bottom:8pt}
  .sh-over{font-family:var(--sans);font-size:7.2pt;letter-spacing:.16em;text-transform:uppercase;margin:0 0 2pt;color:#555}
  .sh-head h1{font-size:23pt}.sh-head p{margin:1pt 0 0}
  .sh-pts{text-align:right}.sh-pts b{font-size:26pt;display:block;line-height:1}.sh-pts span{font-family:var(--sans);font-size:8pt}
  .sh-warn{border:1pt solid #7e1f1b;color:#7e1f1b;padding:3pt 6pt;font-family:var(--sans);font-size:8.5pt}
  .sh-det{margin-top:10pt}
  .sh-det>h2,.sh-gloss>h2{display:flex;justify-content:space-between;align-items:baseline;font-size:13pt;border-bottom:1pt solid #1c1b18;padding-bottom:1.5pt;break-after:avoid}
  .sh-det>h2 i{font-family:var(--sans);font-size:8pt;font-variant-caps:normal;letter-spacing:0}
  .sh-unit{break-inside:avoid;padding:5pt 0 4pt;border-bottom:.5pt solid #aaa}
  .sh-unit h3{display:flex;gap:6pt;align-items:baseline;font-size:11pt}.sh-unit h3 b{margin-left:auto;font-variant-caps:normal;font-size:10pt}
  .sh-role{font-family:var(--sans);font-size:6.8pt;border:.8pt solid #1c1b18;border-radius:50%;width:15pt;height:15pt;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;font-variant-caps:normal;flex:none}
  .sh-unit p{margin:1.5pt 0}.sh-comp{font-style:italic}
  table.stats{font-size:8.4pt;width:auto;min-width:62%;margin:2pt 0}.stats th,.stats td{padding:1pt 5pt;border-bottom:.4pt solid #999}
  .sh-gloss{margin-top:12pt}.sh-gloss p{margin:2pt 0;font-size:8.6pt;break-inside:avoid}
  #sheet footer{margin-top:10pt;font-family:var(--sans);font-size:6.8pt;color:#666;border-top:.5pt solid #999;padding-top:3pt}
}
</style>
